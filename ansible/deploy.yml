---
- name: deploy weatherwise
  hosts: weather_server
  become: true

  vars:
    app_dir: /opt/weatherwise
    source_dir: "{{ playbook_dir }}/.."

  tasks:
    - name: check docker cli
      ansible.builtin.command: docker --version
      register: docker_cli
      changed_when: false
      failed_when: false

    - name: install docker if missing
      ansible.builtin.apt:
        name: docker.io
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: docker_cli.rc != 0

    - name: check docker compose
      ansible.builtin.command: docker compose version
      register: compose_cli
      changed_when: false
      failed_when: false

    - name: install docker compose if missing
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: compose_cli.rc != 0

    - name: enable and start docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: copy compose file
      ansible.builtin.copy:
        src: "{{ source_dir }}/compose.yaml"
        dest: "{{ app_dir }}/compose.yaml"
        mode: "0644"
      notify: rebuild and start weatherwise

    - name: copy frontend files
      ansible.builtin.copy:
        src: "{{ source_dir }}/frontend/"
        dest: "{{ app_dir }}/frontend/"
        directory_mode: "0755"
      notify: rebuild and start weatherwise

    - name: copy backend files
      ansible.builtin.copy:
        src: "{{ source_dir }}/backend/"
        dest: "{{ app_dir }}/backend/"
        directory_mode: "0755"
      notify: rebuild and start weatherwise

    - name: run handlers before checking application state
      ansible.builtin.meta: flush_handlers

    - name: ensure weatherwise is running
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: policy

  handlers:
    - name: rebuild and start weatherwise
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        build: always